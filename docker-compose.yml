version: '3.8'

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: engrenar
      POSTGRES_PASSWORD: engrenar
      POSTGRES_DB: engrenar-db
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engrenar -d engrenar-db"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
